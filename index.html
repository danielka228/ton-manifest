<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TON Wallet Assistant</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <style>
    body{font-family:system-ui,sans-serif;text-align:center;padding:32px 16px;background:var(--tg-theme-bg-color,#10131c);color:var(--tg-theme-text-color,#fff)}
    #ton-connect{display:flex;justify-content:center;margin:24px 0}
    #status{overflow-wrap:anywhere}
  </style>
</head>
<body>
  <h2>TON Wallet Assistant</h2>
  <div id="ton-connect"></div>
  <p id="status">Подключите кошелёк через TON Connect.</p>
  <script>
    const tg=window.Telegram?.WebApp;
    const status=document.getElementById("status");
    let sent=false;
    if(tg){tg.ready();tg.expand();}
    const ui=new TON_CONNECT_UI.TonConnectUI({
      manifestUrl:"https://danielka228.github.io/ton-manifest/tonconnect-manifest.json",
      buttonRootId:"ton-connect"
    });
    ui.onStatusChange(wallet=>{
      if(!wallet?.account)return;
      const address=wallet.account.address;
      status.textContent="Кошелёк подключён: "+address.slice(0,6)+"…"+address.slice(-5);
      if(!tg || !tg.initData){
        status.textContent+=" — откройте приложение кнопкой Mini App из чата с ботом.";
        return;
      }
      if(sent)return;
      sent=true;
      status.textContent="Кошелёк подключён. Возвращаю адрес боту…";
      tg.sendData(JSON.stringify({address}));
    });
  </script>
</body>
</html>
