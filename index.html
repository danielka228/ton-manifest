<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Подключение кошелька</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <style>
    body {
      font-family: -apple-system, Roboto, sans-serif;
      text-align: center;
      padding: 32px 16px;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    #ton-connect { display: flex; justify-content: center; margin: 24px 0; }
  </style>
</head>
<body>
  <h2>TON Wallet Assistant</h2>
  <div id="ton-connect"></div>
  <p id="status">Нажми «Connect Wallet» и выбери кошелёк.</p>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const status = document.getElementById("status");

    const ui = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl: "https://danielka228.github.io/ton-manifest/tonconnect-manifest.json",
      buttonRootId: "ton-connect",
      actionsConfiguration: {
        twaReturnUrl: "https://t.me/MyTonWalletAssistantBot"
      }
    });

    ui.onStatusChange(function (wallet) {
      if (wallet && wallet.account) {
        if (tg.initData) {
          status.textContent = "Кошелёк подключён, отправляю адрес боту…";
          setTimeout(function () {
            tg.sendData(JSON.stringify({ address: wallet.account.address }));
          }, 600);
        } else {
          status.textContent = "Подключено, но страница открыта не из бота.";
        }
      }
    });
  </script>
</body>
</html>
